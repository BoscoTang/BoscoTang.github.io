<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>請輸入密碼</title>
<style>
:root{--bg:#f7f8fa;--surface:#fff;--text:#1c2230;--muted:#5d6678;--line:#e3e6ee;--accent:#2f5bea}
@media (prefers-color-scheme:dark){:root{--bg:#0f131c;--surface:#171c28;--text:#e8ebf3;--muted:#9aa3b8;--line:#262d3d;--accent:#7c9bff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
form{width:min(92vw,360px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:12px;padding:11px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin:10px 0 0;font-size:14px;color:#d64545}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>此頁面受密碼保護</h1>
  <p>請輸入密碼以檢視內容。</p>
  <input id="pw" type="password" placeholder="密碼" autofocus required>
  <button id="btn" type="submit">解鎖</button>
  <div id="msg" role="alert"></div>
</form>
